<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Galería de Fotos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Galería de Fotos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
<ion-col size="6" *ngFor="let photo of photoService.photos; let i = index">
      <img [src]="photo.webviewPath" loading="lazy" />
    </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="addPhotoToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
