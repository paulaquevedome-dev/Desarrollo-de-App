<ion-header [translucent]="true" *ngIf="!isArActive">
  <ion-toolbar>
    <ion-title>Galería de Fotos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Vista Galería Normal -->
  <ng-container *ngIf="!isArActive">
    <div class="ar-trigger-container">
      <ion-button expand="block" color="secondary" (click)="openAR()">
        <ion-icon name="cube-outline" slot="start"></ion-icon>
        Ver Sofá en AR
      </ion-button>
    </div>

    <!-- Rejilla de fotos de la galería existente -->
    <ion-grid>
      <ion-row>
        <ion-col size="6" *ngFor="let photo of photoService.photos; let position = index">
          <ion-img [src]="photo.webviewPath" (click)="photoService.showActionSheet(photo, position)"></ion-img>
        </ion-col>
      </ion-row>
    </ion-grid>

    <ion-fab vertical="bottom" horizontal="center" slot="fixed">
      <ion-fab-button (click)="photoService.addNewToGallery()">
        <ion-icon name="camera"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  </ng-container>

  <!-- Modal / Vista AR Fullscreen -->
  <app-ar-viewer *ngIf="isArActive" (close)="closeAR()"></app-ar-viewer>
</ion-content>
